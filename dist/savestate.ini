[Savestate]
; Keys are Windows virtual-key codes: 116 = F5, 117 = F6, 118 = F7, 120 = F9.
; F5 saves to the current slot, F9 loads it, F6 / F7 select the previous / next slot (10 slots).
SaveKey=116
LoadKey=120
PrevSlotKey=117
NextSlotKey=118

; 1 = show "Savestate 1 saved (55 MB, 35 ms)" etc. in the top-left corner.
ShowMessages=1

; 1 = after a load, re-open the radio / cutscene soundtrack / ambience at the position it had when saved.
RestartStreamedAudio=1

; Folder for the savestate files (about 55 MB each). Empty = the "savestates" folder next to the launcher.
; The files stay there after the game is closed and can be loaded in a later session.
Folder=

; Address space reserved for the game's heap, in MB. The stock game uses 30-60 MB of it.
; Raise it only if the log says "arena full" (e.g. with big streaming-memory mods).
ArenaMB=384

; Where that heap is placed. Savestates can only be loaded at the address they were made at, so leave this as it is.
ArenaBase=0x10100000

[Launcher]
; The game the launcher starts. Empty = ask the first time (the choice is saved here).
Game=
